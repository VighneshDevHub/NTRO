version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensicguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensicguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forensicguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensicguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensicguard}:${POSTGRES_PASSWORD:-forensicguard_dev_password}@postgres:5432/${POSTGRES_DB:-forensicguard}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env before running compose}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # If left blank, the backend auto-generates a keypair into the
      # keys/ volume below on first run and reuses it forever after —
      # see the keys_data volume mount. Set these instead if you're
      # injecting a key from a real secrets manager.
      SIGNING_PRIVATE_KEY_PEM: ${SIGNING_PRIVATE_KEY_PEM:-}
      SIGNING_PUBLIC_KEY_PEM: ${SIGNING_PUBLIC_KEY_PEM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # CRITICAL: without this volume, the auto-generated signing key
      # (Phase 5) would live only in the container's ephemeral
      # filesystem — surviving a plain restart, but wiped out on
      # `docker compose down` or any container recreation, silently
      # reintroducing the exact "certificates die on redeploy" problem
      # Phase 5 fixed. Mounting keys/ as a named volume makes the key
      # persist across the full container lifecycle, not just a process
      # restart.
      - keys_data:/app/keys
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  keys_data:
